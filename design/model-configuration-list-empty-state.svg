<svg width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="1024" fill="#F7F8F7"/>
  <rect x="96" y="48" width="1248" height="928" rx="14" fill="#FEFEFD" stroke="#D9DFDA"/>

  <rect x="96" y="48" width="1248" height="88" rx="14" fill="#F1F4F1"/>
  <path d="M96 122C96 114.268 102.268 108 110 108H1330C1337.73 108 1344 114.268 1344 122V136H96V122Z" fill="#F1F4F1"/>
  <rect x="122" y="75" width="34" height="34" rx="10" fill="#E1EAE4" stroke="#BFD0C4"/>
  <rect x="132" y="85" width="14" height="12" rx="3" stroke="#35684A" stroke-width="1.8"/>
  <path d="M136 85V82.5M142 85V82.5M129 97H149" stroke="#35684A" stroke-width="1.8" stroke-linecap="round"/>
  <text x="172" y="91" fill="#24312A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="650">模型设置</text>
  <text x="172" y="112" fill="#718078" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">统一管理可用于会话和自动路由的模型配置。</text>
  <circle cx="1258" cy="93" r="5" fill="#B6752B"/>
  <text x="1273" y="98" fill="#6F5A3D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">尚未配置</text>

  <text x="122" y="194" fill="#233029" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="720">模型配置</text>
  <text x="122" y="222" fill="#6C7971" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">先创建可复用的模型配置，再单独设置默认模型与自动路由策略。</text>

  <line x1="122" y1="267" x2="1318" y2="267" stroke="#DFE5E0"/>
  <rect x="122" y="245" width="108" height="40" rx="8" fill="#E6F2EA"/>
  <text x="146" y="270" fill="#2F714A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">模型配置</text>
  <rect x="244" y="245" width="122" height="40" rx="8" fill="transparent"/>
  <text x="268" y="270" fill="#78847D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">路由策略</text>
  <rect x="275" y="254" width="10" height="10" rx="2" stroke="#97A39B" stroke-width="1.4"/>
  <path d="M277.5 254V252C277.5 250.067 279.067 248.5 281 248.5C282.933 248.5 284.5 250.067 284.5 252V254" stroke="#97A39B" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="1151" y="242" width="167" height="42" rx="8" fill="#F4F6F4" stroke="#D9E0DB"/>
  <path d="M1172 261V257.5C1172 255.567 1173.57 254 1175.5 254C1177.43 254 1179 255.567 1179 257.5V261" stroke="#99A59D" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="1170" y="260" width="11" height="9" rx="2" stroke="#99A59D" stroke-width="1.5"/>
  <text x="1190" y="269" fill="#89948D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="650">配置路由策略</text>

  <rect x="122" y="324" width="1196" height="452" rx="12" fill="#FCFDFC" stroke="#DCE3DE"/>
  <g transform="translate(672 419)">
    <rect x="0" y="18" width="78" height="64" rx="13" fill="#EFF5F0" stroke="#C8DBC9"/>
    <rect x="15" y="0" width="48" height="37" rx="9" fill="#E4F0E7" stroke="#9CC2A4"/>
    <path d="M28 17H50M28 25H42M20 50H58M20 61H50" stroke="#3B7D53" stroke-width="2" stroke-linecap="round"/>
    <circle cx="57" cy="71" r="14" fill="#D7ECDD" stroke="#97C5A2"/>
    <path d="M57 65V77M51 71H63" stroke="#3B7D53" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="720" y="548" text-anchor="middle" fill="#24312A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="720">还没有模型配置</text>
  <text x="720" y="578" text-anchor="middle" fill="#6B7870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">一个模型配置包含服务商、连接地址、模型 ID 和上下文窗口。</text>
  <text x="720" y="602" text-anchor="middle" fill="#6B7870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">创建后可直接在会话中选择，也可在路由策略中指定它的职责。</text>
  <rect x="640" y="635" width="160" height="44" rx="8" fill="#3E8159"/>
  <path d="M663 657H675M669 651V663" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <text x="688" y="663" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">创建模型配置</text>
  <text x="720" y="713" text-anchor="middle" fill="#53715D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">了解模型配置与路由策略的区别</text>

  <rect x="122" y="815" width="1196" height="84" rx="10" fill="#F4F7F4" stroke="#DDE6DE"/>
  <circle cx="150" cy="857" r="13" fill="#E0ECE2"/>
  <path d="M146 857L149 860L155 853" stroke="#397851" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="178" y="848" fill="#35483B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">默认模型与自动路由独立配置</text>
  <text x="178" y="872" fill="#66806E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">创建模型配置不会立刻改变会话行为。进入“路由策略”后，再选择默认、复杂任务、Flash 和备用模型。</text>
  <text x="1177" y="862" fill="#66806E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="650">创建后解锁</text>

  <line x1="122" y1="930" x2="1318" y2="930" stroke="#E1E6E2"/>
  <text x="122" y="952" fill="#8B968F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">模型配置是可复用资产，路由策略决定未固定模型的会话如何使用它们。</text>
</svg>

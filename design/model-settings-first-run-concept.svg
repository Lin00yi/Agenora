  <path d="M157 966V961.5C157 958.462 159.462 956 162.5 956C165.538 956 168 958.462 168 961.5V966" stroke="#748279" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="155" y="965" width="15" height="12" rx="2" stroke="#748279" stroke-width="1.6"/>
  <text x="196" y="961" fill="#59675F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">下一步：模型目录与自动路由</text>
  <text x="196" y="984" fill="#89948D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">保存第一个连接后解锁。届时可添加 Flash、复杂任务或备用模型。</text>
  <text x="1172" y="974" fill="#89948D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="650">保存后解锁</text>

  <rect x="96" y="1056" width="1248" height="76" rx="14" fill="#F5F7F5"/>
  <text x="122" y="1101" fill="#6E7B73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">请填写 Base URL、API Key 和模型 ID</text>
  <rect x="1174" y="1072" width="144" height="44" rx="8" fill="#3E8159"/>
  <text x="1205" y="1099" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">保存并继续</text>

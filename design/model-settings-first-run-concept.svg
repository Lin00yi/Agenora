  <text x="643" y="417" fill="#1F2D24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">DeepSeek</text>
  <text x="643" y="437" fill="#4D9366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">已选择</text>
  <rect x="764" y="391" width="144" height="60" rx="8" fill="#FEFEFD" stroke="#D9E2DB"/>
  <text x="790" y="426" fill="#3D4A43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="650">OpenAI</text>
  <rect x="920" y="391" width="156" height="60" rx="8" fill="#FEFEFD" stroke="#D9E2DB"/>
  <text x="947" y="426" fill="#3D4A43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="650">Anthropic</text>
  <rect x="1088" y="391" width="204" height="60" rx="8" fill="#FEFEFD" stroke="#D9E2DB"/>
  <text x="1113" y="426" fill="#3D4A43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="650">自定义兼容接口</text>

  <text x="122" y="519" fill="#27332C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">连接信息</text>
  <text x="122" y="545" fill="#718078" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">凭据只会加密保存，不会在此页回显。</text>
  <text x="122" y="593" fill="#344139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="650">Base URL</text>
  <rect x="122" y="609" width="565" height="50" rx="8" fill="#FEFEFD" stroke="#CBD6CE"/>
  <text x="139" y="640" fill="#4C5C53" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">https://api.deepseek.com</text>
  <text x="735" y="593" fill="#344139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="650">API Key</text>
  <rect x="735" y="609" width="583" height="50" rx="8" fill="#FEFEFD" stroke="#CBD6CE"/>
  <path d="M756 632C756 627.582 759.582 624 764 624C768.418 624 772 627.582 772 632C772 636.418 768.418 640 764 640H757" stroke="#829087" stroke-width="1.7" stroke-linecap="round"/>
  <text x="786" y="640" fill="#9AA59F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">sk-••••••••••••••••</text>

  <text x="122" y="710" fill="#344139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="650">模型 ID</text>
  <rect x="122" y="726" width="1196" height="50" rx="8" fill="#FEFEFD" stroke="#CBD6CE"/>
  <text x="139" y="757" fill="#9AA59F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">例如 deepseek-v4-flash</text>
  <rect x="122" y="801" width="1196" height="54" rx="8" fill="#F1F7F2" stroke="#D2E3D5"/>
  <circle cx="147" cy="828" r="10" fill="#D8EBDD"/>
  <path d="M143 828L146 831L152 824" stroke="#367852" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="170" y="824" fill="#315B40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="650">连接后会自动识别模型与上下文窗口</text>
  <text x="170" y="844" fill="#5B7764" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">只有别名或自托管模型才需要在后续步骤中手动覆盖。</text>

  <line x1="122" y1="899" x2="1318" y2="899" stroke="#E0E5E1"/>
  <rect x="122" y="927" width="1196" height="86" rx="10" fill="#FAFBFA" stroke="#DCE3DE" stroke-dasharray="5 5"/>

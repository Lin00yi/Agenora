  <path d="M136 83V80.5M142 83V80.5M129 95H149" stroke="#35684A" stroke-width="1.8" stroke-linecap="round"/>
  <text x="172" y="89" fill="#24312A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="650">模型设置</text>
  <text x="172" y="110" fill="#718078" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">只需完成一次连接，之后可按需扩展模型与路由。</text>
  <circle cx="1258" cy="91" r="5" fill="#3E835A"/>
  <text x="1273" y="96" fill="#4D6254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">未配置</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <circle cx="132" cy="185" r="14" fill="#347550"/>
    <text x="127.5" y="190" fill="#FFFFFF" font-size="13" font-weight="700">1</text>
    <text x="155" y="190" fill="#24312A" font-size="14" font-weight="700">连接模型服务</text>
    <rect x="296" y="179" width="44" height="2" rx="1" fill="#C8D3CB"/>
    <circle cx="362" cy="185" r="14" fill="#E7ECE8"/>
    <text x="357.5" y="190" fill="#7B8880" font-size="13" font-weight="700">2</text>
    <text x="385" y="190" fill="#7B8880" font-size="14" font-weight="600">添加模型</text>
    <rect x="482" y="179" width="44" height="2" rx="1" fill="#DCE3DE"/>
    <circle cx="548" cy="185" r="14" fill="#E7ECE8"/>
    <text x="543.5" y="190" fill="#7B8880" font-size="13" font-weight="700">3</text>
    <text x="571" y="190" fill="#7B8880" font-size="14" font-weight="600">自动路由</text>
  </g>

  <line x1="122" y1="226" x2="1318" y2="226" stroke="#E0E5E1"/>
  <text x="122" y="276" fill="#347550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="750" letter-spacing="1.3">第一步</text>
  <text x="122" y="310" fill="#1F2924" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="720">接入你的第一个模型</text>
  <text x="122" y="338" fill="#6C7971" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">选择服务商，填写凭据和模型 ID。保存后即可开始对话。</text>

  <rect x="122" y="374" width="1196" height="94" rx="10" fill="#F8FAF8" stroke="#D9E2DB"/>
  <text x="146" y="403" fill="#27332C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">选择服务商</text>
  <text x="146" y="428" fill="#718078" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">官方预设会填入接口地址，你仍可改为代理或自托管服务。</text>
  <rect x="592" y="391" width="160" height="60" rx="8" fill="#E6F2EA" stroke="#4D9366" stroke-width="1.5"/>
  <circle cx="618" cy="421" r="13" fill="#D2E8D8"/>

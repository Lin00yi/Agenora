name: agenora

services:
  # ===== App DB (PostgreSQL — commercial-grade, multi-worker safe) =====
  # DB credentials stay `anykb` so existing postgres volumes keep working.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anykb}
      POSTGRES_USER: ${POSTGRES_USER:-anykb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-anykb} -d $${POSTGRES_DB:-anykb}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===== Backend (FastAPI + LangGraph + Milvus Lite embedded) =====
  # Milvus Lite is pure-Python and lives inside the backend process. Its .db
  # file is persisted in the backend-data volume. To switch to Milvus Standalone
  # later, add a `milvus` service and set MILVUS_URI=http://milvus:19530.
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- App DB ---
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-anykb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anykb}

      # --- Vector store (Milvus Lite embedded) ---
      VECTOR_STORE: milvus
      MILVUS_URI: /app/data/milvus_local.db
      MILVUS_TOKEN: ""

      # --- Auth + encryption ---
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      BYOK_REQUIRED: ${BYOK_REQUIRED:-true}
      # Comma-separated emails promoted to platform admin on startup (06-01).
      # The account must be registered first; then it gains /admin access.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}

      # --- LLM provider + fallback keys (users override in /settings) ---
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-deepseek-v4-flash}
      LLM_COMPLEX_MODEL: ${LLM_COMPLEX_MODEL:-deepseek-v4-pro}
      KB_QUERY_POLICY_MODE: ${KB_QUERY_POLICY_MODE:-llm_fallback}
      KB_QUERY_POLICY_MAX_QUERIES: ${KB_QUERY_POLICY_MAX_QUERIES:-3}
      KB_QUERY_POLICY_LLM_MODEL: ${KB_QUERY_POLICY_LLM_MODEL:-deepseek-v4-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}

      # --- Server ---
      APP_ENV: prod
      LOG_LEVEL: INFO
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost}
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-60}

      # --- Observability (internal Trace DB + Langfuse SaaS/self-host) ---
      TRACE_ENABLED: ${TRACE_ENABLED:-true}
      TRACE_STORE_IO: ${TRACE_STORE_IO:-true}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-true}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LANGFUSE_SAMPLE_RATE: ${LANGFUSE_SAMPLE_RATE:-1.0}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-}
    volumes:
      - backend-data:/app/data
    expose:
      - "8000"

  # ===== Frontend (Next.js 14 standalone build) =====
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_APP_NAME: Agenora
      NEXT_TELEMETRY_DISABLED: "1"
    expose:
      - "3000"

  # ===== Reverse proxy (single public entrypoint, HTTPS) =====
  # Enable with: docker compose --profile production up -d
  # Set DOMAIN in .env to match your TLS cert directory under /etc/letsencrypt/live/
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-anykb.cc.cd}
      # Only substitute DOMAIN — leave nginx vars like $host untouched.
      NGINX_ENVSUBST_FILTER: DOMAIN
    volumes:
      - ./nginx/agenora.conf.template:/etc/nginx/templates/default.conf.template:ro
      # Let's Encrypt certificates (managed by host certbot, mounted read-only).
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # ACME http-01 challenge webroot — kept for future webroot-based renewal.
      - certbot-www:/var/www/certbot

volumes:
  # Keep legacy volume names so existing local/prod data is not orphaned
  # after the compose project rename (anykb → agenora).
  postgres-data:
    name: anykb_postgres-data
  backend-data:
    name: anykb_backend-data
  certbot-www:
    name: anykb_certbot-www

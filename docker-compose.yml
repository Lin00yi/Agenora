name: agenora

services:
  # ===== App DB (PostgreSQL — commercial-grade, multi-worker safe) =====
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agenora}
      POSTGRES_USER: ${POSTGRES_USER:-agenora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-agenora} -d $${POSTGRES_DB:-agenora}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===== Neo4j (LightRAG graph storage) =====
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    profiles: ["kg"]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j-data:/data
    healthcheck:
      # Password is interpolated from host .env at compose parse time.
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p '$${NEO4J_PASSWORD}' 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 45s

  # ===== LightRAG Server (knowledge-graph RAG over HTTP) =====
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    restart: unless-stopped
    profiles: ["kg"]
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      HOST: "0.0.0.0"
      PORT: "9621"
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:?set LIGHTRAG_API_KEY in .env}
      LIGHTRAG_GRAPH_STORAGE: Neo4JStorage
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      # LLM / embedding for entity extraction (LightRAG Server side).
      LLM_BINDING: ${LIGHTRAG_LLM_BINDING:-openai}
      LLM_MODEL: ${LIGHTRAG_LLM_MODEL:-deepseek-v4-flash}
      LLM_BINDING_HOST: ${LIGHTRAG_LLM_BINDING_HOST:-https://api.deepseek.com/v1}
      LLM_BINDING_API_KEY: ${LIGHTRAG_LLM_BINDING_API_KEY:-${DEEPSEEK_API_KEY:-${OPENAI_API_KEY:-}}}
      EMBEDDING_BINDING: ${LIGHTRAG_EMBEDDING_BINDING:-openai}
      EMBEDDING_MODEL: ${LIGHTRAG_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: ${LIGHTRAG_EMBEDDING_DIM:-1536}
      EMBEDDING_BINDING_HOST: ${LIGHTRAG_EMBEDDING_BINDING_HOST:-https://api.openai.com/v1}
      EMBEDDING_BINDING_API_KEY: ${LIGHTRAG_EMBEDDING_BINDING_API_KEY:-${OPENAI_API_KEY:-}}
      SUMMARY_LANGUAGE: ${LIGHTRAG_SUMMARY_LANGUAGE:-Chinese}
    volumes:
      - lightrag-data:/app/data/rag_storage
      - lightrag-inputs:/app/data/inputs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9621/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ===== Backend (FastAPI + LangGraph + Milvus Lite embedded) =====
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # --- App DB ---
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agenora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agenora}

      # --- Vector store (Milvus Lite embedded) ---
      VECTOR_STORE: milvus
      MILVUS_URI: /app/data/milvus_local.db
      MILVUS_TOKEN: ""

      # --- LightRAG Server (graph recall) ---
      LIGHTRAG_ENABLED: ${LIGHTRAG_ENABLED:-false}
      LIGHTRAG_BASE_URL: ${LIGHTRAG_BASE_URL:-}
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-}
      LIGHTRAG_QUERY_MODE: ${LIGHTRAG_QUERY_MODE:-local}
      LIGHTRAG_TIMEOUT_S: ${LIGHTRAG_TIMEOUT_S:-20}
      LIGHTRAG_KG_TOP_K: ${LIGHTRAG_KG_TOP_K:-12}
      LIGHTRAG_KG_SOFT_WAIT_S: ${LIGHTRAG_KG_SOFT_WAIT_S:-0}
      LIGHTRAG_KG_ONLY_WHEN_NEEDED: ${LIGHTRAG_KG_ONLY_WHEN_NEEDED:-true}

      # --- Auth + encryption ---
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      BYOK_REQUIRED: ${BYOK_REQUIRED:-true}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}

      # --- LLM provider + fallback keys (users override in /settings) ---
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-deepseek-v4-flash}
      LLM_COMPLEX_MODEL: ${LLM_COMPLEX_MODEL:-deepseek-v4-pro}
      KB_QUERY_POLICY_MODE: ${KB_QUERY_POLICY_MODE:-llm_fallback}
      KB_QUERY_POLICY_MAX_QUERIES: ${KB_QUERY_POLICY_MAX_QUERIES:-2}
      KB_QUERY_POLICY_LLM_MODEL: ${KB_QUERY_POLICY_LLM_MODEL:-deepseek-v4-flash}
      KB_RERANK_SKIP_IF_SCORE_GE: ${KB_RERANK_SKIP_IF_SCORE_GE:-0.7}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${OPENAI_API_KEY:-}}

      # --- Server ---
      APP_ENV: prod
      SCHEMA_BOOTSTRAP: "false"
      LOG_LEVEL: INFO
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost}
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-60}
      # The repository's stdio order service is a development mock and is not
      # baked into the production backend image. Use a real adapter before
      # enabling order execution in a deployed environment.
      ORDERS_MCP_ENABLED: ${ORDERS_MCP_ENABLED:-false}
      RAG_MONITOR_WINDOW_HOURS: ${RAG_MONITOR_WINDOW_HOURS:-24}
      RAG_MONITOR_INTERVAL_SECONDS: ${RAG_MONITOR_INTERVAL_SECONDS:-300}
      RAG_MONITOR_MIN_CALLS: ${RAG_MONITOR_MIN_CALLS:-20}
      RAG_MONITOR_MAX_ERROR_RATE: ${RAG_MONITOR_MAX_ERROR_RATE:-0.05}
      RAG_MONITOR_MAX_EMPTY_RATE: ${RAG_MONITOR_MAX_EMPTY_RATE:-0.45}
      RAG_MONITOR_MAX_P95_LATENCY_MS: ${RAG_MONITOR_MAX_P95_LATENCY_MS:-5000}
      RAG_MONITOR_MIN_AVG_TOP_SCORE: ${RAG_MONITOR_MIN_AVG_TOP_SCORE:-0.50}

      # --- Observability ---
      TRACE_ENABLED: ${TRACE_ENABLED:-true}
      TRACE_STORE_IO: ${TRACE_STORE_IO:-false}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LANGFUSE_SAMPLE_RATE: ${LANGFUSE_SAMPLE_RATE:-1.0}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-}
    volumes:
      - backend-data:/app/data
    expose:
      - "8000"

  # The only production schema writer. API and worker containers start only
  # after this one-shot Alembic job reaches the declared revision.
  migrate:
    build: ./backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agenora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agenora}
      APP_ENV: prod
      SCHEMA_BOOTSTRAP: "false"

  # Durable document-ingest worker. It inherits the exact database, vector,
  # provider and LightRAG configuration from backend; health checks are
  # disabled because this process deliberately does not expose HTTP.
  ingestion-worker:
    extends:
      service: backend
    command: ["python", "-m", "src.capabilities.knowledge.application.jobs"]
    healthcheck:
      disable: true

  # Aggregates persisted RAG tool spans and emits structured warning logs when
  # error / empty-result / latency / relevance thresholds are breached.
  rag-monitor:
    extends:
      service: backend
    command: ["python", "-m", "src.bootstrap.workers.rag_monitor"]
    healthcheck:
      disable: true

  # ===== Frontend (Next.js standalone build) =====
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_CHAT_KB_SELECTION_MODE: ${NEXT_PUBLIC_CHAT_KB_SELECTION_MODE:-hidden}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_APP_NAME: Agenora
      NEXT_PUBLIC_CHAT_KB_SELECTION_MODE: ${NEXT_PUBLIC_CHAT_KB_SELECTION_MODE:-hidden}
      NEXT_TELEMETRY_DISABLED: "1"
    expose:
      - "3000"

  # ===== Reverse proxy (single public entrypoint, HTTPS) =====
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-agenora.cc.cd}
      NGINX_ENVSUBST_FILTER: DOMAIN
    volumes:
      - ./nginx/agenora.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot

volumes:
  postgres-data:
    name: agenora_postgres-data
  backend-data:
    name: agenora_backend-data
  certbot-www:
    name: agenora_certbot-www
  neo4j-data:
    name: agenora_neo4j-data
  lightrag-data:
    name: agenora_lightrag-data
  lightrag-inputs:
    name: agenora_lightrag-inputs

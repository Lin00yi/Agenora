[project]
name = "agenora-mock-orders-mcp"
version = "0.1.0"
description = "Standalone mock orders and refunds MCP server for Agenora development"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

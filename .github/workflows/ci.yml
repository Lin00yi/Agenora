name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev,openai,postgres]"
      - run: ruff check src tests
      - run: python scripts/verify_architecture_paths.py
      - run: python -m src.harness.evaluation.react_cli --gate config/react_eval_gate.json
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # This repository has no frontend unit-test runner yet. Do not invoke a
      # missing npm script: require the actual TypeScript boundary before the
      # production build instead.
      - run: npx tsc --noEmit
      - run: npm run build
